name: Build FastBreak
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FastBreak-1.8.9
          path: build/libs/*.jar

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fastbreak-latest
          name: FastBreak 1.8.9 (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            FastBreak + Backtrack для Minecraft 1.8.9 Forge / LabyMod.
            Скачай `FastBreak-1.8.9.jar` ниже и положи в `.minecraft/mods`.
            G — FastBreak вкл/выкл, `/fb` — настройки.
            H — Backtrack вкл/выкл, `/bt` — настройки.
          files: build/libs/*.jar
