name: Build BlockHitMining
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlockHitMining-1.8.9
          path: build/libs/*.jar

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blockhit-latest
          name: BlockHitMining 1.8.9 (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            1.7 блокхит при копании для Minecraft 1.8.9 Forge / LabyMod.
            Зажми ЛКМ + ПКМ с мечом, глядя на блок: блокируешь и ломаешь одновременно, как в 1.7.10.
            Скачай `BlockHitMining-1.8.9.jar` ниже и положи в `.minecraft/mods`. `/bhm` — вкл/выкл.
          files: build/libs/*.jar
